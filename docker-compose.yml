version: '3.8'

services:
  revit-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: revit-mcp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MCP_PORT: 3000
      MCP_HOST: 0.0.0.0
      CERT_PATH: ./certs/server.crt
      KEY_PATH: ./certs/server.key
      NODE_ENV: production
    volumes:
      - ./certs:/app/certs:ro
      - ./logs:/app/logs
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get('https://localhost:3000/health', {rejectUnauthorized: false}, (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  mcp-network:
    driver: bridge
